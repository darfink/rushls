# Scrapes one Rushls origin. Add each origin to both jobs' targets.
scrape_configs:
  - job_name: rushls
    scrape_interval: 5s
    static_configs:
      - targets: ["127.0.0.1:9090"]   # [metrics] listen
    # authorization:
    #   credentials_file: /run/secrets/metrics-token

  # Per-stream series. A separate job, because one origin can export many of
  # them and they disappear when a stream is retired.
  - job_name: rushls-streams
    scrape_interval: 5s
    metrics_path: /metrics/streams
    static_configs:
      - targets: ["127.0.0.1:9090"]
    # authorization:
    #   credentials_file: /run/secrets/metrics-token
