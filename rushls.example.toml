# Rushls configuration: every TOML setting, grouped by the question it answers.
#
#   1. How publishers connect ....... [ingest]
#   2. Who may publish, and what .... [publish]
#   3. How much this node holds ..... [limits] [memory] [disk]
#   4. What it serves ............... [hls] [http] [https] [tls] [playback]
#   5. What it reports and keeps .... [metrics] [log] [record] [hook.*]
#
# Active lines run a local origin on loopback. Commented lines show compiled
# defaults; lines marked "example" are not defaults.
# Publishing and playback need no authorization in this file. Configure
# authorization (publish.auth, playback.auth) and limits before exposing it.
#
#   rushls --print-config-example > rushls.toml   # this file
#   rushls --check                                 # listeners and memory plan
#
# docs/configuration-reference.md lists every setting with its environment variable
# and CLI flag. Values resolve defaults < TOML < environment < CLI.
#
# Durations read "10s", "1m30s". Sizes read "64MiB". "3x" means three times
# the related target. Credentials are a string, "${VAR}", or { file = "/path" }.
# Their CLI flags take only a file path, e.g. --metrics-token /run/secrets/m.

# name           = "origin-1"              # example; default: hostname
# shutdown_grace = "10s"                   # drain before exit; keep below the scheduler's grace

# ── 1. How publishers connect ─────────────────────────────────────────────

# [ingest]
# idle_timeout  = "10s"                    # connection silent this long -> closed; "off" on trusted links
# stall_timeout = "12s"                    # connected, but no usable media this long -> dropped; "off"

[ingest.rtmp]
listen = "127.0.0.1:1935"                  # example (loopback); default "0.0.0.0:1935"
# proxy_protocol = false                   # true behind a TLS terminator or load balancer that sends PROXY v1/v2

# [ingest.rtmps]                           # RTMP over TLS; needs [tls]. Accepts TLS 1.2 and 1.3
# listen         = "off"                   # e.g. "[::]:1936"
# proxy_protocol = false                   # true behind a TCP load balancer that sends PROXY v1/v2

[ingest.srt]
listen = "127.0.0.1:9000"                  # example (loopback); default "0.0.0.0:9000"; IPv4 only
# latency    = "120ms"                     # raise on lossy or long-haul links; below idle_timeout
# passphrase = { file = "/run/secrets/rushls-srt" }  # example; omit for unencrypted SRT
# encryption = "aes256"                    # aes128, aes192, or aes256

# [ingest.moq]                             # WebTransport; needs [tls]
# listen = "off"                           # e.g. "[::]:4433"

# ── 2. Who may publish, and what ──────────────────────────────────────────

# The table is the default profile. Omitted predicates admit everything this
# origin can mux.
# [publish]
# strict   = true                          # false permits bounded gap recovery
# takeover = false                         # true lets a new publisher replace the current one
# rate     = { max = "1x", burst = "10s", min = "0.5x", window = "30s" }  # example; default: no limits
# video     = { codecs = ["h264", "hevc", "av1"], resolution = { max = "4k" }, frame_rate = { max = 60 }, tracks = { max = 8 } }  # example
# audio     = { codecs = ["aac", "opus", "flac"], sample_rate = ["44.1kHz", "48kHz"], channels = { max = 2 }, tracks = { max = 8 } }  # example
# subtitles = { codecs = ["webvtt", "subrip", "text"], tracks = { max = 8 } }  # example

# Checks each publisher once, when it connects. The service returns identity
# and may name a profile below: {"profile": "premium"}.
# [publish.auth]
# url          = "http://auth.example.internal/v1/admit"  # example
# token        = { file = "/run/secrets/rushls-auth" }      # example
# timeout      = "2s"                      # whole request, connection included
# max_response = "64KiB"
# client_cert  = "/etc/rushls/auth/client.pem"      # example; mutual TLS, reloaded on rotation
# client_key   = "/etc/rushls/auth/client-key.pem"  # example
# ca           = "/etc/rushls/auth/ca.pem"          # example; pin the service's issuer

# A named profile replaces [publish] wholesale, with the same keys.
# [publish.profile.premium]                # example
# strict = true
# rate   = { max = "1x", burst = "30s" }
# video  = { resolution = { max = "4k" }, frame_rate = { max = 60 } }

# ── 3. How much this node holds ───────────────────────────────────────────

# [limits]
# publishers = 256                         # concurrent ingest sessions
# streams    = 1024                        # stored streams, including ended ones still in their window
# publishers_per_address = 16              # example; default: no limit. Per client, IPv6 per /64

# Worst case: publishers × per_publisher + streams × per_stream. `total`
# caps what the budgets may commit; a publication past it is refused.
# [memory]
# total         = "unlimited"              # e.g. "16GiB"
# per_publisher = "128MiB"                 # media in flight before storage; minimum 64MiB, or "unlimited"
# per_stream    = "512MiB"                 # stored media plus cached playlists

# Optional: older window media spills to disk once memory is full.
# [disk]
# per_stream = "8GiB"                      # example; setting it enables spilling
# dir        = "/var/lib/rushls/spill"     # example; default: the platform cache

# ── 4. What it serves ─────────────────────────────────────────────────────

# [hls]
# segment   = "6s"                         # or { target = "6s", max = "2x", tolerance = "0s" }
# part      = "1s"                         # or { target = "1s", max = "2x" }
# window    = "6x"                         # DVR window: completed media in each playlist
# hold_back = "3x"                         # live-edge latency floor, in parts
# scrubbing = true                         # keyframe playlists for fast seeking

[http]
listen = "127.0.0.1:8080"                  # example (loopback); default "0.0.0.0:8080"; "off" for HTTPS only
# public_url      = ""                     # empty keeps playlist URLs relative
# max_connections = 4096                   # across HTTP, HTTPS, and metrics listeners
# max_requests    = 4096                   # including blocked reloads and streaming bodies

# [http.cors]
# origins        = "*"                     # "off", or ["https://player.example.com", "https://*.example.com"]
# credentials    = false                   # true needs an explicit origins list
# max_age        = "10min"
# expose_headers = ["content-length", "content-range", "date"]

# Present enables HTTPS, with the certificate from [tls].
# [https]
# listen            = "[::]:8443"
# min_version       = "1.3"                  # "1.2" for older clients
# handshake_timeout = "5s"
# max_handshakes    = 256

# One certificate for HTTPS, RTMPS, and MoQ ingest. Reloaded on rotation.
# [tls]
# cert = "/etc/rushls/tls/fullchain.pem"   # example
# key  = "/etc/rushls/tls/private-key.pem" # example

# Who may watch. Omit and anyone with the URL may. Viewers present a JWT,
# verified locally. Set exactly one of public_key, jwks_url, or secret.
# [playback.auth]
# public_key   = { file = "/etc/rushls/playback.pem" }   # example; RS256/ES256
# jwks_url     = "https://issuer.example.com/.well-known/jwks.json"  # example
# secret       = "${PLAYBACK_HMAC}"        # example; HS256
# stream_claim = "stream"
# leeway       = "30s"
# claims       = { iss = "https://issuer.example.com", aud = "rushls-origin" }  # example; iss and aud are required

# ── 5. What it reports and keeps ──────────────────────────────────────────

# Omit to serve no metrics. Set listen to the [http] address to share its port.
# [metrics]
# listen = "127.0.0.1:9090"                # example
# token  = "${METRICS_TOKEN}"              # example

# level is Rushls's own; dependencies log at warn. RUST_LOG, when set, replaces
# the whole filter (e.g. "info,quinn=trace"); --log-level overrides RUST_LOG.
# [log]
# level  = "info"                          # error, warn, info, debug, or trace
# format = "text"                          # "json": one object per line, for log collectors

# A copy of every completed segment, independent of the HLS window.
# [record]
# dir         = "/archive"                 # example
# path        = "{stream}/{publication}/{time:%Y/%m/%d}/{rendition}_{segment}.mp4"
# queue_size  = 128
# max_pending = "256MiB"                   # open segments, queued jobs, and the active write

# Event delivery, one table per destination name.
# [hook.billing]                           # example
# url            = "http://billing.example.internal/rushls"
# events         = ["session.ended"]       # also session.started, stream.available, segment.ready, ...
# token          = { file = "/run/secrets/rushls-webhook" }
# signing_secret = "${WEBHOOK_SIGNING_SECRET}"  # whsec_ plus base64 of 32+ random bytes
# client_cert    = "/etc/rushls/hooks/client.pem"
# client_key     = "/etc/rushls/hooks/client-key.pem"
# ca             = "/etc/rushls/hooks/ca.pem"
