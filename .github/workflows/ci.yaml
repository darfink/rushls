name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-and-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_metadata:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      image_tags: ${{ steps.metadata.outputs.image_tags }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      notes: ${{ steps.metadata.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag and select image tags
        id: metadata
        run: python3 tools/release-metadata.py

  binaries:
    name: Build binary (${{ matrix.platform }})
    needs: release_metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin_amd64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows_amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      GIT_SHA: ${{ github.sha }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rushls-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Test Windows libraries and storage
        if: runner.os == 'Windows'
        run: cargo test --workspace --all-features --locked --lib
      - name: Build native release binary
        run: cargo build --release --locked --bin rushls --target ${{ matrix.target }}
      - name: Package and test extracted archive
        run: python3 tools/package-release.py --target ${{ matrix.target }} --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: target/release-assets/*
          if-no-files-found: error

  code:
    name: Validate code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rushls-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rushls-${{ runner.os }}-
      # The runner image ships shellcheck, so `run:` scripts are linted too.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --all-features --locked
      - name: Test Python tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  media:
    name: Validate media
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FFmpeg
        run: brew install ffmpeg
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rushls-media-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: External decoder tests
        run: cargo test --locked --lib --all-features -- --ignored --skip live_av_gap_browser_origin --skip ip_video_gap_playback_fixture
      - name: Recording and RTMP ingest
        run: cargo test --locked --test record_e2e --test rtmp_ingest -- --include-ignored
      - name: Export video GAP fixtures
        env:
          RUSHLS_GAP_FIXTURES: ${{ runner.temp }}/gap-fixtures
        run: cargo test --locked --lib ip_video_gap_playback_fixture -- --ignored
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: video-gap-fixtures
          path: ${{ runner.temp }}/gap-fixtures
          if-no-files-found: error

  chrome:
    name: Validate Chrome playback (patched hls.js)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install playback dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 tools/install-chrome-driver.py --output "$RUNNER_TEMP/chromedriver"
      - name: Build and unit-test patched hls.js
        id: player
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python3 tools/build-hls-player.py --output target/live-gap-reports/player --unit-tests
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: rushls-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Patched player — live control and GAP playback (required)
        id: patched
        run: python3 tools/run-live-gap-ci.py --driver "$RUNNER_TEMP/chromedriver" --hls-js target/live-gap-reports/player/hls.patched.js --output target/live-gap-reports/patched
      - name: A/V sync in hls.js and Shaka (required)
        id: av_sync
        if: ${{ !cancelled() && steps.player.outcome == 'success' }}
        run: |
          cargo build --locked
          python3 tools/av-sync/check-av-sync.py --browsers chrome --headless \
            --chromedriver "$RUNNER_TEMP/chromedriver" \
            --hls-js target/live-gap-reports/player/hls.patched.js \
            --output target/live-gap-reports/av-sync.json
      - name: Official hls.js 1.7.3 compatibility (informational)
        id: official
        if: ${{ !cancelled() && steps.player.outcome == 'success' }}
        continue-on-error: true
        run: python3 tools/run-live-gap-ci.py --driver "$RUNNER_TEMP/chromedriver" --hls-js target/live-gap-reports/player/hls.official.min.js --output target/live-gap-reports/official
      - name: Playback summary
        if: always()
        env:
          PLAYER_OUTCOME: ${{ steps.player.outcome }}
          PATCHED_OUTCOME: ${{ steps.patched.outcome }}
          OFFICIAL_OUTCOME: ${{ steps.official.outcome }}
          AV_SYNC_OUTCOME: ${{ steps.av_sync.outcome }}
        run: |
          {
            echo '## Chrome playback'
            echo ''
            echo '| Check | Result | Policy |'
            echo '| --- | --- | --- |'
            echo "| Patched player build and upstream unit tests | $PLAYER_OUTCOME | Required |"
            echo "| Patched player: control, GAPs, rendition switches | $PATCHED_OUTCOME | Required |"
            echo "| Official hls.js 1.7.3 compatibility | $OFFICIAL_OUTCOME | Informational; pending upstream part-loading correction |"
            echo "| A/V sync with late audio and B-frames (patched hls.js, Shaka) | $AV_SYNC_OUTCOME | Required |"
            echo ''
            echo 'The live-gap-playback artifact contains both player reports, the A/V sync measurements (av-sync.json), the source patch, unit-test log, and build provenance. A patched-player pass does not imply official-release compatibility.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-gap-playback
          path: target/live-gap-reports
          if-no-files-found: error

  gstreamer:
    name: Validate GStreamer playback
    # Ubuntu 24.04 ships GStreamer 1.24, which stalls on this live-to-ENDLIST case.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GStreamer and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-gi gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: rushls-gstreamer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Decode live audio and video
        run: /usr/bin/python3 tools/run-gstreamer-ci.py --case control --output target/gstreamer-reports
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gstreamer-playback
          path: target/gstreamer-reports
          if-no-files-found: error

  documentation:
    name: Validate documentation examples
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install publisher dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/caption-plugin
          key: rushls-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'tools/check-doc-examples.py', '.github/workflows/ci.yaml') }}
          restore-keys: rushls-docs-${{ runner.os }}-${{ runner.arch }}-
      - name: Build pinned caption muxer without transcription models
        env:
          CAPTIONS_REVISION: 8fbeda5a33ddc8fbd9a90ba1219bee3e288919ca
        run: |
          git init "$RUNNER_TEMP/gst-captions"
          git -C "$RUNNER_TEMP/gst-captions" remote add origin https://github.com/darfink/gst-captions.git
          git -C "$RUNNER_TEMP/gst-captions" fetch --depth=1 origin "$CAPTIONS_REVISION"
          git -C "$RUNNER_TEMP/gst-captions" checkout --detach FETCH_HEAD
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/caption-plugin" cargo build --release --locked --manifest-path "$RUNNER_TEMP/gst-captions/Cargo.toml" --no-default-features --features flvmux
          echo "GST_PLUGIN_PATH=$GITHUB_WORKSPACE/target/caption-plugin/release" >> "$GITHUB_ENV"
      - name: Build origin and validate documentation configuration
        run: |
          cargo build --locked --bin rushls
          cargo test --locked --test configuration
      - name: Extract and run documented publishing recipes
        run: python3 tools/check-doc-examples.py --output target/doc-examples
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: documentation-examples
          path: target/doc-examples
          if-no-files-found: warn

  apple:
    name: Validate Apple HLS
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/apple-hls.yaml
    secrets: inherit

  publish:
    name: Publish container image
    needs: [release_metadata, binaries, code, media, chrome, gstreamer, documentation, apple]
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.release_metadata.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  release:
    name: Publish tagged release
    needs: [release_metadata, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify archives and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.release_metadata.outputs.prerelease }}
          NOTES: ${{ needs.release_metadata.outputs.notes }}
        working-directory: release-assets
        run: |
          cat ./*.sha256 | sort > checksums.sha256
          test "$(wc -l < checksums.sha256)" -eq 5
          sha256sum --check checksums.sha256
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            # Notes come from CHANGELOG.md, validated by release_metadata before any build.
            printf '%s\n' "$NOTES" > release-notes.md
            gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file release-notes.md --title "Rushls $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.zip checksums.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest="$([ "$PRERELEASE" = false ] && echo true || echo false)"

  crates:
    name: Publish to crates.io
    # Last, because an upload is permanent (it can only be yanked): every
    # validation gate, the container, and the GitHub Release must succeed first.
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      # Exchanged for a short-lived crates.io token through trusted publishing.
      id-token: write
    env:
      # Trusted publishing can only be configured for crates that already exist.
      # The first release authenticates with this scoped token instead; delete
      # the secret once each crate has a trusted publisher.
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.BOOTSTRAP_TOKEN == ''
      # Workspace publishing verifies every package before uploading any, and
      # uploads the internal crates before the `rushls` crate that depends on them.
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.BOOTSTRAP_TOKEN }}
        run: cargo publish --workspace --locked
