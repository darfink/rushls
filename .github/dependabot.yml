version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # One monthly PR for compatible updates, so dependency churn costs one CI run.
  # Semver-incompatible bumps arrive separately, since they usually need code changes.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        update-types: [minor, patch]
