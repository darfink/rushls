# Rushls reference configuration: every operator setting, once.
#
# Uncommented lines are what a public origin should set. Commented lines are
# the rest of the surface, shown at their default or with an example value.
# Every table is optional; omit one to take the compiled default, which is
# permissive: open publish, no stream cap, media as fast as the link allows.

# Identifies this node in its own logs and metrics, and as the producer of
# hook events. Defaults to the hostname. Several nodes may share one name, in
# which case consumers of hook events see a single producer.
# name = "origin-1"

# How long a restart waits for parked viewer requests and queued hook events
# before exiting anyway. Keep it below the grace period your scheduler allows.
shutdown = "10s"

[rtmp]
listen  = "[::]:1935"                    # dual-stack; use 0.0.0.0 for IPv4 only
timeout = "10s"                          # idle limit for an established publisher;
                                         # an unauthenticated handshake gets a
                                         # tighter one. "off" on a trusted link only

[srt]
listen  = "[::]:9000"
latency = "120ms"                        # raise on lossy or long-haul links
timeout = "5s"                           # idle limit for a peer; must exceed latency
# passphrase_file = "/run/secrets/rushls-srt-passphrase"
# passphrase      = "..."                # inline form; prefer passphrase_file
# encryption      = "aes256"

[http]
listen     = "[::]:8080"                 # "off" to serve HTTPS only
public_url = ""                          # empty = relative playlist URLs

[http.cors]
origins           = ["https://player.example.com"]
# origins        = ["https://*.example.com"]    # one label, like a TLS wildcard
# origins        = ["https://**.example.com"]   # any depth, only where you own the subtree
# origins        = "*"                          # any origin; incompatible with allow_credentials = true
# origins        = "off"                        # no CORS headers, same-origin players only
allow_credentials = false                # true requires an explicit origins list, never "*"
max_age           = "10min"

# HTTPS listener, independent of the cleartext one above. Comment out the whole
# table to serve cleartext only, which is usual behind a proxy that ends TLS.
# [http.tls]
# listen      = "[::]:8443"
# certificate = "/etc/rushls/tls/fullchain.pem"
# key         = "/etc/rushls/tls/private-key.pem"

# Who may publish. Omit this table and anyone may. Do not omit it on the
# internet. Each publisher is checked once, when it connects.
[auth.publish]
url = "http://auth.example.internal/v1/publish/admit"
# token_file = "/run/secrets/rushls-auth-token"
# token      = "..."                     # inline form; prefer token_file
# This service may widen what this node accepts, so it is trusted. On an
# untrusted network, prove the origin to it and pin the issuer in return.
# Certificates reload in place on rotation, as the TLS listener's do.
# client_certificate = "/etc/rushls/auth/client.pem"
# client_key         = "/etc/rushls/auth/client-key.pem"
# ca                 = "/etc/rushls/auth/ca.pem"   # pin the service's issuer

# Who may watch. Omit this table and anyone with the URL may. Viewers present a
# JWT, which is verified locally: no request leaves this node per playlist
# reload. Set exactly one of public_key, jwks_url, or secret.
# [auth.playback]
# public_key_file = "/etc/rushls/playback.pem"        # RS256/ES256 verifying key
# public_key      = "-----BEGIN PUBLIC KEY-----..."   # inline form
# jwks_url        = "https://issuer.example.com/.well-known/jwks.json"
# secret_file     = "/run/secrets/rushls-playback-hmac"   # HS256 shared secret
# secret          = "${PLAYBACK_HMAC}"                # inline form; prefer secret_file
# stream_claim    = "stream"                          # which claim carries the stream admitted
# leeway          = "30s"                             # clock skew allowed on exp and nbf
# Claims that must be present and equal to these values. iss and aud are
# required. Add your own to narrow further.
# [auth.playback.claims]
# iss  = "https://issuer.example.com"
# aud  = "rushls-origin"
# tier = "premium"

[accept]
ceiling  = { pace = "1x", burst = "10s" }     # throttle: at most realtime, with a ten-second head start; omit burst for no head start, omit the table for no cap
# floor    = { pace = "0.5x", window = "30s" }  # disconnect: below half realtime across any 30s window; omit for no floor
stall    = "12s"                                # disconnect: nothing usable arrived for this long; "off" = no idle cap
takeover = false                                # true lets a new publisher replace the current one; the old session is closed

[accept.video]
codecs     = ["h264", "hevc", "av1"]     # omit for every codec this origin can mux
# codecs   = { preset = "common" }       # frozen set; omitting codecs also admits ones added later
resolution = { max = "4k" }              # fits a 3840x2160 box, either orientation
frame_rate = { min = 24, max = 60 }      # or [23.976, 25, "30000/1001", 30]: decimals and quotients mix, both exact
tracks     = { max = 8 }

[accept.audio]
codecs      = ["aac", "opus"]
sample_rate = { min = 44100, max = 48000 }   # Hz
channels    = { max = 2 }
tracks      = { max = 8 }

[accept.subtitles]
codecs = ["webvtt", "subrip", "text"]
tracks = { max = 8 }

# Named alternatives to the predicates above, selected by an auth response
# returning {"policy": "premium"}. Each holds the same schema as [accept] and
# replaces it wholesale for that publisher. Omit unless a service names one.
# [accept.policy.premium]
# video = { resolution = { max = "4k" }, frame_rate = { max = 60 } }
# audio = { channels = { max = 6 } }

[hls]
segment  = "6s"                          # target length of each media file
part     = "1s"                          # low-latency update interval; shorter than segment
hold_back = "3x"                         # live-edge latency floor, as a multiple of part
#          = "3s"                        # or an absolute duration; both forms are accepted
retain   = "1m"                          # how long media stays fetchable, live and after a drop
# retain is clipped by memory_per_stream. At 5 Mbps, 256MiB holds about 7m.

[capacity]
publishers        = 64                   # concurrent ingest sessions
streams           = 256                  # live, plus those still held by retain; when full, a new stream is refused
memory_per_stream = "256MiB"             # retained parts and segments; worst-case is streams x this,
                                         # plus a fixed per-publisher pipeline cost while ingesting
# memory_per_publisher = "128MiB"        # not yet implemented; today the pipeline cost is a
                                         # compiled per-publisher ceiling, reported per session
                                         # as rushls_session_pipeline_bytes
# disk_per_stream = "8GiB"               # older media spills here; omit to stay in memory
# dir             = "/var/lib/rushls"    # optional; default is the platform cache (.../rushls/dvr)

# Write a copy of every segment to a filesystem. Outlives the stream and is
# never served by this origin, so it is unrelated to retain. For sending
# segments elsewhere, use a hook with payload = true; this table is local only.
# [record]
# dir     = "/archive"
# pattern = "{stream}/{time:%Y/%m/%d}/{rendition}_{segment}.m4s"
# Completed segments only, never parts. Each file carries its own header, so it
# plays on its own, and appears at its final name only once fully written.

# Omit this whole table to serve no metrics at all. Present, they get their own
# listener; set listen to the [http] address to serve them on that port instead.
[metrics]
listen = "127.0.0.1:9090"
# token_file = "/run/secrets/rushls-metrics-token"
# token      = "${METRICS_TOKEN}"        # inline form; prefer token_file
# Totals at /metrics. Sessions and per-stream retention at /metrics/streams.

# [hook.automation]
# url        = "http://automation.example.internal/rushls"
# events     = ["publisher.start", "stream.ready", "stream.gone", "publisher.stop"]
# token_file = "/run/secrets/rushls-webhook-token"
# token      = "${WEBHOOK_TOKEN}"        # inline form; prefer token_file
# On an untrusted network, prove this origin to the endpoint and pin the
# issuer in return. Same three fields as [auth.publish], and the same reload
# behaviour: certificates rotate in place. A hook setting any of these gets a
# connection pool of its own, so only the ones that ask pay for it.
# client_certificate = "/etc/rushls/hooks/client.pem"
# client_key         = "/etc/rushls/hooks/client-key.pem"
# ca                 = "/etc/rushls/hooks/ca.pem"

# [hook.billing]
# url    = "http://billing.example.internal/rushls"
# events = ["publisher.stop"]

# Fires once per completed segment, per rendition. Segment cadence: one stream
# at segment = "6s" sends 600/hour.
# [hook.archive]
# url    = "http://archive.example.internal/rushls"
# events = ["segment.ready"]
# payload = true                         # attach the segment bytes; default sends its URL only
