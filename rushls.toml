# Complete Rushls administrator configuration reference.
#
# This file contains every supported setting and its built-in default. Rushls
# reads it when selected with `--config rushls.toml` or `RUSHLS_CONFIG`.
# Environment variables and CLI arguments override values from this file.
#
# Environment names follow the section path, for example:
#   RUSHLS_HTTP_LISTEN=127.0.0.1:8080
# CLI names use dashes:
#   --http-listen 127.0.0.1:8080
#
# The static-provider publishing key shown below is only a placeholder. Replace
# it before enabling that provider, or use `key_file` with a secret mount.

[server]
# Maximum publishers that may be connected and actively publishing at once.
maximum_concurrent_publishers = 256
# Maximum publishers one ingest listener may be authenticating at once. This
# bounds the window between a connection arriving and it proving who it is,
# which the limit above does not cover: it counts only publishers that already
# authenticated. Surplus connections wait in the listener's backlog rather than
# being refused.
#
# Each listener has its own budget, so a flood of anonymous connections on one
# protocol cannot stop the other from admitting anyone. The process ceiling is
# therefore this value times the number of ingest listeners — two today, RTMP
# and SRT — and that product is also the most requests an external
# authentication provider will ever see at once.
maximum_pending_publishers_per_listener = 64

[auth]
# The default `open` provider accepts every publisher without checking a key
# and exposes the requested app/stream unchanged. Select `static` when the
# ingest listener is reachable from an untrusted network.
provider = "open"

# Every publisher selects a named policy. The `default` policy exists with
# built-in values even when this section is omitted; it is written out here
# because this file is the complete configuration reference.
[auth.policies.default]
takeovers = "allow"
# These are codec admission rules, not container formats. Rushls detects the
# container automatically for each ingest protocol.
video_codecs = ["h264", "hevc", "av1"]
audio_codecs = ["aac", "opus"]
subtitle_codecs = ["webvtt", "subrip", "text"]

# Multi-language and alternate tracks count separately.
maximum_video_tracks = 8
maximum_audio_tracks = 8
maximum_subtitle_tracks = 8

# Video above either limit is rejected before publication begins. Exact rates
# such as NTSC may be written as "60000/1001".
maximum_video_resolution = "7680x4320"
maximum_video_frame_rate = "240"

# What to do when a publisher sends media faster than wall clock: a file pushed
# at full speed, or an encoder catching up after a stall.
#
#   "pace"    slow the publisher down until wall clock catches up
#   "reject"  refuse the publication instead
#
# `pace` accepts a file as a live stream, which is what you want for testing and
# for re-streaming recorded material. `reject` is for a stream that is only
# meaningful if it is genuinely live, where silently pacing a replay would be
# worse than refusing it.
faster_than_realtime = "pace"

# How far ahead of wall clock media may run before the above applies. It means
# the same thing under both modes; only the response differs.
#
# This is slack, not a target. A live encoder tracking wall clock never reaches
# it. What consumes it is burstiness: the pacer sees individual samples, so an
# encoder that hands over a whole group of pictures at once is momentarily that
# far ahead through no fault of its own. Set this comfortably above your
# publishers' keyframe interval — the default covers a typical two-second GOP.
#
# Too low, and a well-behaved encoder is throttled; the symptom is backpressure
# and rising latency rather than an error, which is easy to mistake for a
# network problem. Too high under `pace`, and a file-push runs that far ahead
# before anything slows it, since the lead is media buffered in the pipeline.
maximum_lead = "2s"

# `pace` only, and rejected outright under `reject`. A forward jump larger than
# this is a broken timeline rather than something to sleep off, so the
# publication fails instead of stalling for the length of the gap. Under
# `reject` the lead check already catches such a jump, so the key would do
# nothing and is refused rather than silently ignored.
maximum_timestamp_jump = "10s"

[auth.open]
# Every admitted publisher has the `anonymous` principal. Omit this field to
# select the built-in `default` policy.
policy = "default"

# Alternative authenticated static-provider configuration. This table and
# `[auth.open]` are mutually exclusive.
#
# [auth.static.publishers.configured-publisher]
# The final table key is the stable identity used for logs, metrics, and future
# lifecycle hooks.
# stream = "live/camera"
# Configure exactly one of `key` and `key_file`. A key file is read exactly,
# including whitespace, so mounted secrets have unambiguous credentials.
# key = "replace-with-a-publishing-key"
# key_file = "/run/secrets/rushls-publish-key"
# Omit this field to select `default`.
# policy = "default"

# Alternative external-provider configuration, mutually exclusive with the two
# tables above. Each publisher is admitted by asking a service you run, which
# answers with an identity and the name of a policy defined above:
#
#   {"decision": "allow", "stream_id": "events/main", "principal": "account-42"}
#   {"decision": "deny",  "reason": "subscription_inactive"}
#
# The response selects a policy by name and never carries limits of its own, so
# what a publisher may send stays defined here. An unknown name denies.
#
# Anything other than a decision — a timeout, an unreachable service, a 5xx, a
# body that is not the agreed shape — denies the publication. Nothing is
# retried: this runs inside the publisher's admission deadline, and the service
# may have side effects. Each request carries a unique `request_id` so a service
# that wants idempotence has a key to use.
#
# Concurrent requests are bounded by `maximum_pending_publishers_per_listener`
# above, times the number of ingest listeners.
#
# [auth.http]
# url = "http://auth-sidecar:8081/v1/publish/admit"
# The request timeout must be shorter than the internal admission deadline,
# which is 10 seconds; otherwise the session gives up before the service does
# and reports a stage rather than the service that failed to answer.
# request_timeout = "2s"
# maximum_response_bytes = "64KiB"
# Applied when an allowing response names no policy.
# default_policy = "default"
# token = "replace-with-an-auth-token"
# token_file = "/run/secrets/rushls-auth-token"

[ingest.rtmp]
# Use 127.0.0.1 when a local proxy is the only intended RTMP client.
listen = "0.0.0.0:1935"
# Reject malformed Enhanced FLV structures. Set to "passthrough" only for
# diagnostics or compatibility with a known non-conforming publisher.
enhanced_validation = "strict"

# How long an RTMP peer may produce nothing before its session is closed.
# This is the one timeout most deployments need: it reaches the handshake,
# established-session reads, and writes together.
peer_timeout = "10s"

# Per-phase overrides, for deployments that need them. Anything left unset
# inherits `peer_timeout`, so naming one phase does not disturb the others.
#
# The two phases are not equivalent and are worth tuning apart. A handshake
# read covers an *unauthenticated* peer, which is the cheapest way for one to
# hold a socket, so it may be tightened well below `peer_timeout`. A session
# read covers an established publisher, where an over-tight value drops a
# legitimate stream between keyframes and turns hardening into an outage.
#
# Rushls refuses a handshake timeout longer than the session timeout, and a
# session timeout below one second.
# handshake_read_timeout = "3s"
# session_read_timeout = "30s"
# write_timeout = "10s"

# Any of these may be "off" to wait indefinitely. That is reasonable on a
# trusted link and a liability on a public one, so rushls warns at startup
# whenever a timeout is disabled.

[ingest.srt]
# `[::]` is the dual-stack wildcard used by the SRT listener.
listen = "[::]:9000"
# Increase this on lossy or long-distance networks, at the cost of latency.
latency = "120ms"

# Uncomment to require encrypted SRT. Passphrases contain 10 to 79 UTF-8 bytes.
# passphrase = "replace-with-an-srt-passphrase"
# passphrase_file = "/run/secrets/rushls-srt-passphrase"
encryption_key_length = "aes256"

# How long an SRT peer may send nothing before its session is dropped. This is
# not the RTMP `peer_timeout`: SRT keeps its own keepalive, so this bounds a
# protocol-level idle rather than a stalled socket read. It must exceed
# `latency`, or it fires inside the receiver's own reorder window.
peer_idle_timeout = "5s"

[ingest.health]
# When a session is judged to have stalled. Both accept a multiple of the
# segment duration ("1x") or a fixed duration ("6s").
#
# The multiple is the default because these deadlines are only meaningful
# against the output cadence: an absolute value sized for a 6s segment becomes
# stall detection that fires before a single segment can complete once
# segmentation is retuned.

# The publisher has gone quiet.
source_stall = "1x"
# The publisher is still sending, but the media stops making sense.
media_stall = "1x"

# How far past its own output cadence a session may fall behind before its
# publication is treated as stalled. Always relative: the quantity it bounds is
# the cadence itself.
publication_stall_multiplier = 3

# How often liveness is judged. A sampling rate rather than a policy — near the
# stall values above it makes detection jittery, and far below them it costs
# work without detecting anything sooner. Rushls refuses a stall deadline
# shorter than this, since sampling could not observe it.
health_interval = "1s"

[hls]
# Empty produces relative playlist URLs, which is normally right behind a
# reverse proxy or CDN. Set an absolute prefix only when playlists must point
# somewhere else, for example "https://cdn.example.com/live".
public_base_url = ""

# Rushls aims for these durations, but input keyframes and sample cadence may
# require nearby boundaries. Shorter values lower latency and increase request
# and storage overhead.
segment_duration = "6s"
part_duration = "1s"

# Minimum completed media retained in each live playlist: a fixed duration
# ("18s") or a multiple of the segment duration ("6x"). Must be at least
# three times the segment duration, which the spec requires of live playlists.
playlist_window = "6x"

[storage]
# Includes active streams and recently inactive streams retained for reconnect.
maximum_streams = 1024
# An inactive stream remains playable for this long while awaiting a publisher.
inactive_stream_retention = "30s"
# Payload budget for one stream. Metadata has separate internal safety limits.
maximum_media_per_stream = "512MiB"

[http]
# Serves HLS, the always-on `/health/live` and `/health/ready` probes, and
# `/metrics` when metrics are enabled. Readiness returns 503 during startup and
# graceful shutdown; liveness remains 200 for as long as HTTP is responsive.
listen = "0.0.0.0:8080"

[http.cors]
# Use "*", "off", or an explicit array of web player origins:
# origins = ["https://player.example.com", "https://admin.example.com"]
#
# An entry may begin with a wildcard label. The scheme, the host boundary, and
# the port are always matched exactly, so "https://*.example.com" admits
# "https://a.example.com" but never "https://evil-example.com", the apex
# "https://example.com", or a different scheme or port.
#
#   "https://*.example.com"         one label, as a TLS wildcard certificate
#   "https://**.video.example.com"  any depth: a.video…, b.c.video…
#   "https://*.example.com:8443"    a non-default port must be spelled out
#
# Two stars are deliberately separate from one: widening a wildcard enlarges
# what a subdomain takeover would reach, so it is written down rather than
# assumed. A wildcard only ever appears as the leftmost label; patterns like
# "https://foo.*.example.com" are refused at startup.
origins = "*"
# Browser credentials require an explicit origin list; they cannot be used
# together with "*". Note that combining them with a wildcard means any
# takeover under that suffix reaches credentialed streams.
allow_credentials = false
max_age = "10min"

# TLS is optional. Uncomment the complete table to terminate HTTPS in Rushls.
# Certificates are reloaded in place when either file rotates.
#
# [http.tls]
# certificate = "/etc/rushls/tls/fullchain.pem"
# key = "/etc/rushls/tls/private-key.pem"
#
# The unauthenticated edge of the node. A TLS handshake is more expensive to
# hold open than a plain socket, so a peer that completes TCP and then stalls
# mid-handshake is the cheapest way to consume resources here.
#
# Size these together: the cost one peer can impose is the product of the two,
# so tightening the timeout while leaving the concurrency ceiling alone buys
# less than it appears to.
# handshake_timeout = "5s"
# maximum_pending_handshakes = 256

[metrics]
# Prometheus metrics are served at `/metrics` on the HTTP listener when enabled.
enabled = false
# Set a bearer token to authenticate scrapes. For secrets, prefer this file with
# restricted permissions, RUSHLS_METRICS_TOKEN, or a mounted secret file.
# token = "replace-with-a-metrics-token"
# token_file = "/run/secrets/rushls-metrics-token"
# Per-stream series use stream names as labels and may create high cardinality.
per_stream = false

[hooks]
# Lifecycle events delivered to services you run. Nothing is sent unless
# `[hooks.endpoints]` below names at least one destination.
#
# Delivery is best-effort and at-least-once while the process lives. Every event
# carries a stable id that retries reuse, so deduplicate on `source` + `id`.
# Events for one stream arrive in the order they occurred, though a prefix may
# be missing after an outage; nothing is promised across different streams, and
# nothing survives a crash. Hooks are a notification channel, not a ledger: make
# anything correctness-critical reconcile against the node's own state.

# CloudEvents `source`, identifying this deployment. With the per-event id it
# identifies an occurrence, so keep it stable across restarts. Several nodes may
# share one, in which case consumers see a single logical producer.
source = "urn:rushls:node"
# How long a shutdown waits for queued events before abandoning them.
drain_timeout = "5s"
# Deadline for one delivery attempt, and the largest response read from an
# endpoint. Both are per-request, so they are independent of the shorter
# deadline publisher admission runs under.
request_timeout = "5s"
maximum_response_bytes = "64KiB"

# Each destination is a named table. The name identifies it in logs and metrics.
#
# Bodies are structured-mode CloudEvents:
#
#   {"specversion": "1.0", "id": "...", "source": "urn:rushls:node",
#    "type": "rushls.session.started.v1", "subject": "live/camera",
#    "time": "...", "datacontenttype": "application/json", "data": {...}}
#
# Answer 2xx to acknowledge. A 408, 425, 429 or 5xx is retried with backoff,
# honouring `Retry-After` up to 30 seconds; any other 4xx is taken as "this
# request is wrong" and is not retried, since retrying would hold up everything
# queued behind it for that stream.
#
# [hooks.endpoints.automation]
# url = "http://automation:9000/rushls/events"
# Required rather than defaulting to everything, so a consumer written today is
# never sent an event type added after it. One or more of:
#   "session.started"    a publisher was admitted
#   "stream.available"   the stream became playable
#   "stream.unavailable" the reconnect window closed and viewers now 404
#   "session.ended"      a publisher stopped, for any reason
#
# The two pairs describe different lifetimes and must not be confused. A
# publisher disconnecting produces `session.ended` and nothing more, because a
# reconnect within `inactive_stream_retention` resumes a stream viewers never
# lost. `stream.unavailable` is the stream itself ending, once nobody came back.
# events = ["session.started", "stream.available", "stream.unavailable", "session.ended"]
# Events held for this endpoint before the oldest waiting one is dropped. The
# oldest, never the newest: what survives stays in order and the most recent
# state is what is kept. A separate nonblocking ingress uses the same capacity
# but is normally empty; filling it means the dispatcher itself was CPU-starved
# or stopped, and drops the new event rather than delaying the media task.
# queue_capacity = 1000
# Distinct streams delivered at once. One request per stream is the ordering
# rule, so this is also the concurrency.
# maximum_in_flight = 8
# Attempts per event, the first included.
# maximum_attempts = 5
# token = "replace-with-a-hook-token"
# token_file = "/run/secrets/rushls-hook-token"
