# Complete Rushls administrator configuration reference.
#
# This file contains every supported setting and its built-in default. Rushls
# reads it when selected with `--config rushls.toml` or `RUSHLS_CONFIG`.
# Environment variables and CLI arguments override values from this file.
#
# Environment names follow the section path, for example:
#   RUSHLS_HTTP_LISTEN=127.0.0.1:8080
# CLI names use dashes:
#   --http-listen 127.0.0.1:8080
#
# The publishing key below is only a placeholder. Replace it before starting
# Rushls with this file.

[server]
# Maximum publishers that may be connected and actively publishing at once.
maximum_concurrent_publishers = 256

[publishing]
# Shared credential presented by RTMP and SRT publishers. For secrets, prefer
# this file with restricted permissions or RUSHLS_PUBLISHING_KEY.
key = "replace-with-a-publishing-key"
# Public stream name used in HLS URLs. Slashes may be used for organization.
stream_id = "live/camera"
# A reconnect or replacement publisher may take over from the current one.
allow_takeover = true

[publishing.media]
# These are codec admission rules, not container formats. Rushls detects
# supported containers automatically for each ingest protocol.
video_codecs = ["h264", "hevc", "av1"]
audio_codecs = ["aac", "opus"]
subtitle_codecs = ["webvtt", "subrip"]

# Multi-language and alternate tracks count separately.
maximum_video_tracks = 8
maximum_audio_tracks = 8
maximum_subtitle_tracks = 8

# Video above either limit is rejected before publication begins. Exact rates
# such as NTSC may be written as "60000/1001".
maximum_video_resolution = "7680x4320"
maximum_video_frame_rate = "240"

[ingest.rtmp]
# Use 127.0.0.1 when a local proxy is the only intended RTMP client.
listen = "0.0.0.0:1935"

[ingest.srt]
# `[::]` is the dual-stack wildcard used by the SRT listener.
listen = "[::]:9000"
# Increase this on lossy or long-distance networks, at the cost of latency.
latency = "120ms"

# Uncomment to require encrypted SRT. Passphrases contain 10 to 79 UTF-8 bytes.
# passphrase = "replace-with-an-srt-passphrase"
encryption_key_length = "aes256"

[hls]
# Empty produces relative playlist URLs, which is normally right behind a
# reverse proxy or CDN. Set an absolute prefix only when playlists must point
# somewhere else, for example "https://cdn.example.com/live".
public_base_url = ""

# Rushls aims for these durations, but input keyframes and sample cadence may
# require nearby boundaries. Shorter values lower latency and increase request
# and storage overhead.
segment_duration = "6s"
part_duration = "1s"

# Minimum completed segments retained in each live playlist.
playlist_segments = 6

[storage]
# Includes active streams and recently inactive streams retained for reconnect.
maximum_streams = 1024
# An inactive stream remains playable for this long while awaiting a publisher.
inactive_stream_retention = "30s"
# Payload budget for one stream. Metadata has separate internal safety limits.
maximum_media_per_stream = "512MiB"

[http]
# Serves HLS, and `/metrics` when metrics are enabled.
listen = "0.0.0.0:8080"

[http.cors]
# Use "*", "off", or an explicit array of web player origins:
# origins = ["https://player.example.com", "https://admin.example.com"]
origins = "*"
# Browser credentials require an explicit origin list; they cannot be used
# together with "*".
allow_credentials = false
max_age = "10min"

# TLS is optional. Uncomment the complete table to terminate HTTPS in Rushls.
# Certificates are reloaded in place when either file rotates.
#
# [http.tls]
# certificate = "/etc/rushls/tls/fullchain.pem"
# key = "/etc/rushls/tls/private-key.pem"

[metrics]
# Prometheus metrics are served at `/metrics` on the HTTP listener when enabled.
enabled = false
# Set a bearer token to authenticate scrapes. For secrets, prefer this file with
# restricted permissions or RUSHLS_METRICS_TOKEN.
# token = "replace-with-a-metrics-token"
# Per-stream series use stream names as labels and may create high cardinality.
per_stream = false
