# Complete Rushls administrator configuration reference.
#
# This file contains every supported setting and its built-in default. Rushls
# reads it when selected with `--config rushls.toml` or `RUSHLS_CONFIG`.
# Environment variables and CLI arguments override values from this file.
#
# Environment names follow the section path, for example:
#   RUSHLS_HTTP_LISTEN=127.0.0.1:8080
# CLI names use dashes:
#   --http-listen 127.0.0.1:8080
#
# The static-provider publishing key shown below is only a placeholder. Replace
# it before enabling that provider, or use `key_file` with a secret mount.

[server]
# Maximum publishers that may be connected and actively publishing at once.
maximum_concurrent_publishers = 256
# Maximum publishers one ingest listener may be authenticating at once. This
# bounds the window between a connection arriving and it proving who it is,
# which the limit above does not cover: it counts only publishers that already
# authenticated. Surplus connections wait in the listener's backlog rather than
# being refused.
#
# Each listener has its own budget, so a flood of anonymous connections on one
# protocol cannot stop the other from admitting anyone. The process ceiling is
# therefore this value times the number of ingest listeners — two today, RTMP
# and SRT — and that product is also the most requests an external
# authentication provider will ever see at once.
maximum_pending_publishers_per_listener = 64

[auth]
# The default `open` provider accepts every publisher without checking a key
# and exposes the requested app/stream unchanged. Select `static` when the
# ingest listener is reachable from an untrusted network.
provider = "open"

# Every publisher selects a named policy. The `default` policy exists with
# built-in values even when this section is omitted; it is written out here
# because this file is the complete configuration reference.
[auth.policies.default]
takeovers = "allow"
# These are codec admission rules, not container formats. Rushls detects the
# container automatically for each ingest protocol.
video_codecs = ["h264", "hevc", "av1"]
audio_codecs = ["aac", "opus"]
subtitle_codecs = ["webvtt", "subrip"]

# Multi-language and alternate tracks count separately.
maximum_video_tracks = 8
maximum_audio_tracks = 8
maximum_subtitle_tracks = 8

# Video above either limit is rejected before publication begins. Exact rates
# such as NTSC may be written as "60000/1001".
maximum_video_resolution = "7680x4320"
maximum_video_frame_rate = "240"

[auth.open]
# Every admitted publisher has the `anonymous` principal. Omit this field to
# select the built-in `default` policy.
policy = "default"

# Alternative authenticated static-provider configuration. This table and
# `[auth.open]` are mutually exclusive.
#
# [auth.static.publishers.configured-publisher]
# The final table key is the stable identity used for logs, metrics, and future
# lifecycle hooks.
# stream = "live/camera"
# Configure exactly one of `key` and `key_file`. A key file is read exactly,
# including whitespace, so mounted secrets have unambiguous credentials.
# key = "replace-with-a-publishing-key"
# key_file = "/run/secrets/rushls-publish-key"
# Omit this field to select `default`.
# policy = "default"

# Alternative external-provider configuration, mutually exclusive with the two
# tables above. Each publisher is admitted by asking a service you run, which
# answers with an identity and the name of a policy defined above:
#
#   {"decision": "allow", "stream_id": "events/main", "principal": "account-42"}
#   {"decision": "deny",  "reason": "subscription_inactive"}
#
# The response selects a policy by name and never carries limits of its own, so
# what a publisher may send stays defined here. An unknown name denies.
#
# Anything other than a decision — a timeout, an unreachable service, a 5xx, a
# body that is not the agreed shape — denies the publication. Nothing is
# retried: this runs inside the publisher's admission deadline, and the service
# may have side effects. Each request carries a unique `request_id` so a service
# that wants idempotence has a key to use.
#
# Concurrent requests are bounded by `maximum_pending_publishers_per_listener`
# above, times the number of ingest listeners.
#
# [auth.http]
# url = "http://auth-sidecar:8081/v1/publish/admit"
# The request timeout must be shorter than the internal admission deadline,
# which is 10 seconds; otherwise the session gives up before the service does
# and reports a stage rather than the service that failed to answer.
# request_timeout = "2s"
# connect_timeout = "500ms"
# maximum_response_bytes = "64KiB"
# Applied when an allowing response names no policy.
# default_policy = "default"
# token = "replace-with-an-auth-token"
# token_file = "/run/secrets/rushls-auth-token"

[ingest.rtmp]
# Use 127.0.0.1 when a local proxy is the only intended RTMP client.
listen = "0.0.0.0:1935"

[ingest.srt]
# `[::]` is the dual-stack wildcard used by the SRT listener.
listen = "[::]:9000"
# Increase this on lossy or long-distance networks, at the cost of latency.
latency = "120ms"

# Uncomment to require encrypted SRT. Passphrases contain 10 to 79 UTF-8 bytes.
# passphrase = "replace-with-an-srt-passphrase"
# passphrase_file = "/run/secrets/rushls-srt-passphrase"
encryption_key_length = "aes256"

[hls]
# Empty produces relative playlist URLs, which is normally right behind a
# reverse proxy or CDN. Set an absolute prefix only when playlists must point
# somewhere else, for example "https://cdn.example.com/live".
public_base_url = ""

# Rushls aims for these durations, but input keyframes and sample cadence may
# require nearby boundaries. Shorter values lower latency and increase request
# and storage overhead.
segment_duration = "6s"
part_duration = "1s"

# Minimum completed segments retained in each live playlist.
playlist_segments = 6

[storage]
# Includes active streams and recently inactive streams retained for reconnect.
maximum_streams = 1024
# An inactive stream remains playable for this long while awaiting a publisher.
inactive_stream_retention = "30s"
# Payload budget for one stream. Metadata has separate internal safety limits.
maximum_media_per_stream = "512MiB"

[http]
# Serves HLS, and `/metrics` when metrics are enabled.
listen = "0.0.0.0:8080"

[http.cors]
# Use "*", "off", or an explicit array of web player origins:
# origins = ["https://player.example.com", "https://admin.example.com"]
#
# An entry may begin with a wildcard label. The scheme, the host boundary, and
# the port are always matched exactly, so "https://*.example.com" admits
# "https://a.example.com" but never "https://evil-example.com", the apex
# "https://example.com", or a different scheme or port.
#
#   "https://*.example.com"         one label, as a TLS wildcard certificate
#   "https://**.video.example.com"  any depth: a.video…, b.c.video…
#   "https://*.example.com:8443"    a non-default port must be spelled out
#
# Two stars are deliberately separate from one: widening a wildcard enlarges
# what a subdomain takeover would reach, so it is written down rather than
# assumed. A wildcard only ever appears as the leftmost label; patterns like
# "https://foo.*.example.com" are refused at startup.
origins = "*"
# Browser credentials require an explicit origin list; they cannot be used
# together with "*". Note that combining them with a wildcard means any
# takeover under that suffix reaches credentialed streams.
allow_credentials = false
max_age = "10min"

# TLS is optional. Uncomment the complete table to terminate HTTPS in Rushls.
# Certificates are reloaded in place when either file rotates.
#
# [http.tls]
# certificate = "/etc/rushls/tls/fullchain.pem"
# key = "/etc/rushls/tls/private-key.pem"

[metrics]
# Prometheus metrics are served at `/metrics` on the HTTP listener when enabled.
enabled = false
# Set a bearer token to authenticate scrapes. For secrets, prefer this file with
# restricted permissions, RUSHLS_METRICS_TOKEN, or a mounted secret file.
# token = "replace-with-a-metrics-token"
# token_file = "/run/secrets/rushls-metrics-token"
# Per-stream series use stream names as labels and may create high cardinality.
per_stream = false
