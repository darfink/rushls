# Local HLS origin. Everything is a permissive default; this file only narrows
# the listeners to loopback so nothing is exposed by accident.
#
#   rtmp://127.0.0.1:1935/<app>/<name>
#   srt://127.0.0.1:9000?streamid=publish:<name>
#   http://127.0.0.1:8080/<app>/<name>/index.m3u8
#
# WebTransport ingest is off. Turn it on with [ingest.moq] listen and a [tls]
# certificate and key; compiled defaults stay certificate-free.
# Anyone may publish, at any speed, in any codec this origin can mux. A file
# pushed as fast as the link allows is packaged that fast, which is what
# setting no rate limit asks for. See rushls.example.toml for optional
# settings, and run `rushls --check` to see the resolved listeners and memory.
# Configure authorization and deployment limits before exposing ingest publicly.

[ingest.rtmp]
listen = "127.0.0.1:1935"

[ingest.srt]
listen = "127.0.0.1:9000"

[http]
listen = "127.0.0.1:8080"
