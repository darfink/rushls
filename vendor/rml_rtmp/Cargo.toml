[package]
name = "rml_rtmp"
description = "Rust library for handling aspects of the RTMP protocol."
version = "0.8.0"
# CROWDCAST: upstream omits `edition`, so Cargo defaults it to 2015. Stated
# explicitly to silence the inference warning. It genuinely is 2015 code - it
# uses crate-relative imports like `use messages::RtmpMessage` - and migrating
# it would balloon the diff against upstream for no benefit. The proxy crate
# itself is edition 2024.
edition = "2015"
publish = false
authors = ["Matthew Shapiro <me@mshapiro.net>"]
repository = "https://github.com/KallDrexx/rust-media-libs"
license = "MIT"
readme = "README.md"
categories = ["multimedia", "multimedia::video", 'multimedia::audio']
keywords = ["rtmp", "video", "streaming"]

[dependencies]
# Upstream used a workspace path dependency here; we take it from crates.io.
rml_amf0 = "0.3.0"
byteorder = "1.3"
bytes = "1"
rand = "0.8"
hmac = "0.10"
sha2 = "0.9"
thiserror = "1.0"
