[package]
name = "rushls"
version = "0.1.0"
edition = "2024"

[features]
allocation-counting = []

[dependencies]
arc-swap = "1"
derive_more = { version = "2", features = ["debug", "deref", "display"] }
bytes = "1.12.1"
bytesize = "2"
conf = "0.4"
ffmpeg-sys-next = { version = "8.1.0", default-features = false, features = ["avformat"] }
humantime = "2"
isolang = { version = "2.4.0", default-features = false }
libc = "0.2"
notify = "8"
notify-debouncer-full = "0.7"
nz = "0.4"
parking_lot = "0.12"
# `ring` rather than the default `aws-lc-rs`: the latter wants cmake and nasm,
# and this build already carries as much C toolchain dependency as it should.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scuffle-rtmp = "0.2.3"
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
toml = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
urlencoding = "2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "original-uri", "query", "tokio"] }
http-body-util = "0.1.4"
http-body = "1.1.0"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
serde_json = "1"
http = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "native-tokio", "http1", "tls12", "logging"] }
uuid = { version = "1.24.0", features = ["v7"] }
base64 = "0.22"
tower-http = { version = "0.6", default-features = false, features = ["cors"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rcgen = "0.14"
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
# 0.2.3 does not advance timestamps for new messages using type-3 chunk
# headers and conflates chunk size with the RTMP flow-control window. Keep the
# patch local until Scuffle publishes the upstream fixes.
scuffle-rtmp = { path = "vendor/scuffle-rtmp" }
