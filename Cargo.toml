[package]
name = "rushls"
version = "0.1.0"
edition = "2024"

[features]
allocation-counting = []

[dependencies]
cc-outbound.workspace = true
cc-tls = { workspace = true, features = ["axum"] }
arc-swap = "1"
derive_more = { version = "2", features = ["debug", "deref", "display"] }
bytes = "1.12.1"
bytesize = "2"
conf = "0.4"
ffmpeg-sys-next = { version = "8.1.0", default-features = false, features = ["avformat"] }
humantime = "2"
isolang = { version = "2.4.0", default-features = false }
libc = "0.2"
notify = "8"
notify-debouncer-full = "0.7"
nz = "0.4"
parking_lot = "0.12"
# `ring` rather than the default `aws-lc-rs`: the latter wants cmake and nasm,
# and this build already carries as much C toolchain dependency as it should.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scuffle-rtmp = "0.2.3"
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
toml = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
urlencoding = "2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "original-uri", "query", "tokio"] }
http-body-util = "0.1.4"
http-body = "1.1.0"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
serde_json = "1"
http = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "native-tokio", "http1", "tls12", "logging"] }
uuid = { version = "1.24.0", features = ["v7"] }
base64 = "0.22"
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
h264-reader = "0.8.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std", "time"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rcgen = "0.14"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
pedantic = { priority = -1, level = "deny" }
similar_names = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["."]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

# Shared across both applications. Anything listed here is a version both apps
# agree on; a crate needing something different keeps it in its own manifest
# rather than forcing the other to move.
[workspace.dependencies]
# Internal
cc-outbound = { path = "crates/cc-outbound" }
cc-tls = { path = "crates/cc-tls" }
arc-swap = "1"
bytes = "1"
derive_more = { version = "2", features = ["debug", "deref", "display"] }
http = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = [
  "ring",
  "native-tokio",
  "http1",
  "tls12",
  "logging",
] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
notify = "8"
notify-debouncer-full = "0.7"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
] }
[profile.release]
lto = "thin"

# `[patch]` is only honoured at the workspace root, so this moved up from
# `.` when the workspace was formed.
#
# 0.2.3 does not advance timestamps for new messages using type-3 chunk headers
# and conflates chunk size with the RTMP flow-control window. Keep the patch
# local until Scuffle publishes the upstream fixes.
[patch.crates-io]
scuffle-rtmp = { path = "vendor/scuffle-rtmp" }
