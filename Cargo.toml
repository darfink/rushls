[package]
name = "rushls"
version = "0.1.0"
edition = "2024"

[features]
allocation-counting = []

[dependencies]
cc-hooks.workspace = true
cc-metrics.workspace = true
cc-outbound.workspace = true
cc-rtmp.workspace = true
cc-tls = { workspace = true, features = ["axum"] }
arc-swap = "1"
derive_more = { version = "2", features = ["debug", "deref", "display"] }
bytes = "1.12.1"
bytesize = "2"
conf = "0.4"
directories = "6"
# Streaming MPEG-TS demux and codec-config records. CENC and playlist
# spokes stay off: this crate only consumes the TS event source.
transmux = { version = "0.24", default-features = false, features = ["std"] }
rml_amf0.workspace = true
broadcast-common = { version = "9.3", default-features = false, features = ["std"] }
humantime = "2"
isolang = { version = "2.4.0", default-features = false }
# Local JWT verification on every viewer request. `ring` matches this crate's
# rustls backend, so playback auth does not pull in a second crypto stack.
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
libc = "0.2"
notify = "8"
notify-debouncer-full = "0.7"
nz = "0.4"
parking_lot = "0.12"
# Live SRT ingest. Pure Rust; IPv4-only until rsrt grows a dual-stack listener.
rsrt = "0.3.4"
# `ring` rather than the default `aws-lc-rs`: the latter wants cmake and nasm.
# ring still compiles a small C/asm kernel at build time; it does not link a
# system crypto library.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
toml = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
urlencoding = "2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "original-uri", "query", "tokio"] }
http-body-util = "0.1.4"
http-body = "1.1.0"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
serde_json = "1"
http = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "native-tokio", "http1", "tls12", "logging"] }
uuid = { version = "1.24.0", features = ["v7"] }
base64 = "0.22"
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
h264-reader = "0.8.0"
scuffle-h265 = "0.2.2"
scuffle-av1 = "0.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
cc-rtmp.workspace = true
bytes = "1.12.1"
serde_json = "1"
nz = "0.4"
libc = "0.2"
parking_lot = "0.12"

[lints.clippy]
pedantic = { priority = -1, level = "deny" }
similar_names = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["."]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

# Shared across both applications. Anything listed here is a version both apps
# agree on; a crate needing something different keeps it in its own manifest
# rather than forcing the other to move.
[workspace.dependencies]
# Internal
cc-outbound = { path = "crates/cc-outbound" }
cc-hooks = { path = "crates/cc-hooks" }
cc-rtmp = { path = "crates/cc-rtmp" }
cc-tls = { path = "crates/cc-tls" }
cc-metrics = { path = "crates/cc-metrics" }
rml_rtmp = { path = "vendor/rml_rtmp" }

# External
arc-swap = "1"
bytes = "1"
derive_more = { version = "2", features = ["debug", "deref", "display"] }
http = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = [
  "ring",
  "native-tokio",
  "http1",
  "tls12",
  "logging",
] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
notify = "8"
notify-debouncer-full = "0.7"
parking_lot = "0.12"
rml_amf0 = "0.3"
# `ring` rather than `aws-lc-rs`: the latter wants cmake and NASM, which both
# applications independently chose to avoid in their build images.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
] }
uuid = { version = "1", features = ["v4", "v7"] }
[profile.release]
lto = "thin"
