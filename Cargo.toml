[package]
name = "rushls"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A low-latency HLS origin with RTMP, SRT, and Media over QUIC ingest"
readme = "README.md"
keywords = ["hls", "streaming", "rtmp", "srt", "moq"]
categories = ["multimedia::video", "network-programming", "command-line-utilities"]
# Ship only what builds and documents the binary; tests, tooling, and CI stay in
# the repository. `rushls.example.toml` is embedded by `--print-config-example`.
include = ["/src/**/*.rs", "/build.rs", "/rushls.example.toml", "/README.md", "/LICENSE"]

[features]
allocation-counting = []

[dependencies]
# `chrono` only for operator-facing strftime patterns in `record.pattern`:
# validation via `StrftimeItems` and formatting with `%Y/%m/%d` vocabulary.
# `time` (workspace) stays the runtime clock; its formatting syntax is
# different, so it cannot validate strftime strings.
chrono = { version = "0.4", default-features = false, features = ["std"] }
rtmpx.workspace = true
rushls-common = { workspace = true, features = [
  "accept",
  "axum",
  "config",
  "hooks",
  "metrics",
  "outbound",
  "proxy-protocol",
  "tls",
] }
arc-swap = "1"
derive_more = { version = "2", features = ["debug", "deref", "display"] }
bytes = "1.12.1"
bytesize.workspace = true
conf.workspace = true
directories.workspace = true
# Streaming MPEG-TS demux and codec-config records. CENC and playlist
# spokes stay off: this crate only consumes the TS event source.
transmux = { version = "0.24", default-features = false, features = ["std"] }
broadcast-common = { version = "9.3", default-features = false, features = ["std"] }
humantime = "2"
isolang = { version = "2.4.0", default-features = false }
# Local JWT verification on every viewer request. `ring` matches this crate's
# rustls backend, so playback auth does not pull in a second crypto stack.
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
libc = "0.2"
notify = "8"
notify-debouncer-full = "0.7"
nz = "0.4"
parking_lot = "0.12"
# Live SRT ingest. Pure Rust; IPv4-only until rsrt grows a dual-stack listener.
rsrt = "0.3.4"
# `ring` rather than the default `aws-lc-rs`: the latter wants cmake and nasm.
# ring still compiles a small C/asm kernel at build time; it does not link a
# system crypto library.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Already in the tree as the rustls backend; named directly for the one hash
# this crate computes itself, the MOQ certificate fingerprint a browser pins
# with `serverCertificateHashes`. Taking a second digest crate for 32 bytes
# would add a stack that duplicates what rustls already links.
ring = "0.17"
# Media-over-QUIC ingest. `web-transport-quinn` defaults to aws-lc-rs; pin
# `ring` so this crate does not grow a second crypto stack. `moq-native` is
# deliberately not used: it is a CLI-oriented helper (clap, websocket, tcp)
# and its default features pull aws-lc-rs.
web-transport-quinn = { version = "0.12.1", default-features = false, features = ["ring"] }
moq-net = "0.3.8"
# LOC frame codec only: a varint property block and the codec bitstream, with
# `bytes` and `moq-net` as its whole dependency tree. The catalog it pairs with
# is parsed in `source::moq::catalog`; taking `hang` and `moq-mux` for those two
# jobs would add a container-conversion stack (MP4, MPEG-TS, MKV, FLV) that
# this origin never reaches, for a draft schema it refuses most of anyway.
moq-loc = "0.2.17"
# Shared with moq-net: poll several track readers under one waiter without
# cancelling in-flight reads.
kio = "0.6.2"
url.workspace = true
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time.workspace = true
toml.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
urlencoding = "2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "original-uri", "query", "tokio"] }
http-body-util = "0.1.4"
http-body = "1.1.0"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
serde_json = "1"
http = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio", "server-auto", "service"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "native-tokio", "http1", "tls12", "logging"] }
uuid = { version = "1.24.0", features = ["v7"] }
base64 = "0.22"
tower-http = { version = "0.7", default-features = false, features = ["cors"] }
h264-reader = "0.9.0"
scuffle-h265 = "0.2.2"
scuffle-av1 = "0.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "std", "time"] }
cap-std = "4"
cap-fs-ext = "4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# `x509-parser` so the Apple HLS suite can sign a throwaway listener leaf with
# a CA the machine already trusts, instead of installing a trust root itself.
rcgen = { version = "0.14", features = ["x509-parser"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
rtmpx.workspace = true
bytes = "1.12.1"
serde_json = "1"
nz = "0.4"
libc = "0.2"
parking_lot = "0.12"

[lints.clippy]
pedantic = { priority = -1, level = "deny" }
similar_names = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Added to pedantic in Rust 1.99. Its suggested replacement for
# `assert!(x.is_empty())` is `assert_eq!(x, [] as [T; 0])`, which is noisier,
# and most of these asserts already carry a message naming what was expected.
assert_is_empty = "allow"

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["."]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/darfink/rushls"
homepage = "https://github.com/darfink/rushls"

# Common dependency versions for the application and its infrastructure crates.
[workspace.dependencies]
# Internal
rushls-common = { path = "crates/rushls-common", version = "0.1.0" }
rtmpx = "3.1.1"

# External
conf = "0.4"
directories = "6"
toml = "1"
bytesize = "2"
arc-swap = "1"
bytes = "1"
derive_more = { version = "2", features = ["debug", "deref", "display"] }
http = "1"
http-body-util = "0.1"
humantime = "2"
hyper-rustls = { version = "0.27", default-features = false, features = [
  "ring",
  "native-tokio",
  "http1",
  "tls12",
  "logging",
] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
notify = "8"
notify-debouncer-full = "0.7"
parking_lot = "0.12"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
] }
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[profile.release]
lto = "thin"

[target."cfg(windows)".dev-dependencies]
junction = "2"
