[package]
name = "cc-hooks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Best-effort, per-subject-ordered delivery of lifecycle events to operator-configured endpoints"

[dependencies]
ring = "0.17"
base64 = "0.22"
bytes.workspace = true
cc-outbound.workspace = true
# Redacts the bearer token from `Debug`, so a credential cannot reach a log
# through a derived formatter.
derive_more.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
# `rt` for the `JoinSet` that holds one in-flight request per subject.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
parking_lot.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
