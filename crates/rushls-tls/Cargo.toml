[package]
name = "rushls-tls"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TLS termination with certificates that rotate under a running listener"
include = ["/src/**/*.rs", "/LICENSE"]

[features]
# Implements `axum::serve::Listener`, for a caller serving HTTP from this
# listener. Off by default so a non-HTTP user does not compile axum.
axum = ["dep:axum"]

[dependencies]
arc-swap.workspace = true
# `axum::serve` is gated on `tokio` plus an HTTP version.
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
], optional = true }
notify.workspace = true
notify-debouncer-full.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time", "sync"] }
tokio-rustls.workspace = true

[dev-dependencies]
rcgen = "0.14"
